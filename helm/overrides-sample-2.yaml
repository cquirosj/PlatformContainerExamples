transport:
  # Connection string to connect to RabbitMQ running in Docker Compose infrastructure
  # Using host.docker.internal to access the host machine from Kubernetes pods in Docker Desktop
  connectionString: "host=host.docker.internal:5672"
  # The broker type, see https://docs.particular.net/servicecontrol/transports
  type: "RabbitMQ.QuorumConventionalRouting"

# RavenDB URL for ServiceControl Error instance
# Using host.docker.internal to access the host machine from Kubernetes pods in Docker Desktop
ravenDBUrl: "http://host.docker.internal:8084"

audit:
  # Multiple audit instances with dedicated queues and separate RavenDB instances
  instances:
    - suffix: "sales"
      queue: "sales.audit"
      ravenDBUrl: "http://host.docker.internal:8081"
    - suffix: "billing"
      queue: "billing.audit"
      ravenDBUrl: "http://host.docker.internal:8082"
    - suffix: "shipping"
      queue: "shipping.audit"
      ravenDBUrl: "http://host.docker.internal:8083"

pulse:
  service:
    # Using ClusterIP instead of LoadBalancer for Docker Desktop with nginx ingress controller
    type: "ClusterIP"
  
  # Enable ingress to access ServicePulse externally through nginx controller
  ingress:
    create: true
    className: "nginx"
    host: "servicepulse-multi.local"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
